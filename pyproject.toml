[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensics-agent"
version = "0.1.0"
description = "Forensics / Investigation Agent for the Cyber Incident Response Council"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

# NOTE: PyTorch / Transformers / vLLM / AGNTCY are intentionally NOT Stage A
# dependencies. They are Stage B concerns and must be added per-workstream.

# Stage B (model-engineer): approved optional extra for the Transformers
# backend that loads `alirezaaminzadeh/soc-analyst-tool-use` locally.
# On this aarch64 GB10 host, PyPI torch wheels are CPU-only builds.
inference = [
    "torch",
    "transformers",
    "accelerate",
    "peft",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["forensics", "forensics.*", "contracts", "coordination"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that REALLY call inference servers/models (skipped when unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["contracts", "coordination", "forensics"]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
